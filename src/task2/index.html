<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../modal.css" />
    <title>EXAMPLE</title>
  </head>
  <body>
    <div class="js-form-container fb fb-h">
      <form class="form box js-form">
          <input type="text" 
        class="form-control" 
        name="js-form-car-brand" 
        placeholder="Brand"/>
           <input type="text" 
        class="form-control" 
        name="js-form-car-model" 
        placeholder="Model"/>
          <input type="text" 
        class="form-control" 
        name="js-form-car-image" 
        placeholder="Image"/>
        <textarea type="text" 
        class="form-control" 
        name="js-form-car-info"
        rows="10"  
        placeholder="Description">
        </textarea>

        <button class="form-control" type="submit">Create item</button>
      </form>
      
      <div class="box" style="width: auto">
        <ul class="js-items list">
          <li class="box item hight">
            <h5>BMW-X-6</h5>
            <div class="fb">
              <p class="item-desc">
                BMW X6 — це розкішний кросовер класу люкс, який поєднує в собі 
                спортивну динаміку та елегантний дизайн. 
                Вперше представлений у 2008 році, X6 став першим автомобілем BMW, 
                який поєднав характеристики спортивного купе та SUV
              </p>
              <img
                src="https://cdn.bmwblog.com/wp-content/uploads/2019/10/BMW-X6-M-Performance-Parts-1.jpg"
                alt=""
              />
              <div class="buttons">
                <button class="form-control" data-type="show">SHOW MORE</button>
                <button class="form-control" data-type="delete">DELETE</button>
              </div>
              
              </li>
             </ul>
            </div>

    <div class="backdrop">
      <div class="modalka"></div>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
